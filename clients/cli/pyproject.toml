[project]
name = "selfagent-cli"
version = "0.1.0"
description = "Self-Agent 命令行客户端（类 Claude Code 的交互式对话）"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
# 安装后全局可用 selfagent 命令
selfagent = "selfagent_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfagent_cli"]
