[project]
name = "selfagent-cli"
version = "0.1.0"
description = "Self-Agent 命令行客户端（类 Claude Code 的交互式对话）"
readme = "README.md"
requires-python = ">=3.12"  # 与主包一致（本地模式 import app.*）；3.10 已于 2026-10-01 EOL

# 本地模式要在本进程里跑 Agent，所以依赖主包 self-agent。
# 开发时用 `pip install -e .` 装主包 + `pip install -e clients/cli` 装 CLI。
dependencies = [
    "httpx>=0.27.0,<1.0",
    "rich>=13.7.0,<16.0",     # 15.0 唯一 breaking 是去掉 Python 3.8
    "prompt_toolkit>=3.0.0,<4.0",
]

[project.scripts]
# 安装后全局可用 selfagent 命令
selfagent = "selfagent_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfagent_cli"]
