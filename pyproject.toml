[project]
name = "self-agent"
version = "0.1.0"
description = "企业级 AI Agent —— LangGraph + MCP + A2A + 多协议 LLM(GLM/OpenAI/Anthropic)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Self-Agent" }]
license = { text = "MIT" }

# 版本约束原则：每个依赖都给**上界**。
# 只写 ">=" 意味着下次 `uv sync` 可能装到任意大版本——实测在没有上界时，
# redis 8.x、neo4j 6.x、bcrypt 5.x、sse-starlette 3.x 会跨 breaking 版本。
# 上界卡在「下一个大版本」，配合提交的 uv.lock 保证构建可复现；
# 升级时改上界并跑测试，而不是被动地被 resolver 推着走。
# 2026-09 已跟进的大版本：openai 2→3、anthropic 0→1（两者 breaking 点都是
# 默认 HTTP 客户端换成 httpx2；本项目不传自定义 http client，只传
# timeout/max_retries，兼容无碍）。mcp 仍锁 1.x——见 MCP 段注释。
dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sse-starlette>=3.0.0,<4.0",   # 3.x 改了 ping/send_timeout 行为，已适配

    # --- LLM 协议层（多 provider 统一）---
    "openai>=3.0.0,<4.0",          # GLM / OpenAI 走 OpenAI 兼容协议
    "anthropic>=1.7.0,<2.0",       # Anthropic 原生协议

    # --- Agent 编排 ---
    "langgraph>=1.2.0,<2.0",
    "langgraph-checkpoint-postgres>=3.1.0,<4.0",
    # 本地/CLI 形态的状态存储：单文件 SQLite，不依赖任何数据库服务
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0",
    "langchain-core>=1.3.3,<2.0",  # 1.x 主线；提供消息类型与 @tool 装饰器；adapters 要求 >=1.3.3

    # --- MCP 协议（2.x，2026-07-28 规范大版本）---
    # 官方桥接已迁移：langchain-mcp-adapters 仓库归档（2026-09-17），
    # MCP 支持并入 langchain 主包的 langchain.mcp 命名空间（官方推荐
    # `pip install langchain[mcp]`）。该 extra 依赖 fastmcp>=4（独立维护的
    # FastMCP 框架），底层拉起 mcp 2.x 协议 SDK。本项目的 mcp server 侧
    # 也随之从 mcp.server.fastmcp.FastMCP 迁到 fastmcp.FastMCP。
    "langchain[mcp]>=1.4.2,<2.0",
    "mcp>=2.0.0,<3.0",

    # --- A2A 协议（Agent 间协作）---
    "a2a-sdk>=1.1.0,<2.0",

    # --- 数据库驱动（异步）---
    "asyncpg>=0.30.0,<1.0",        # PostgreSQL async（业务数据）
    # psycopg 的 pool extra 是必需的：LangGraph 的 checkpointer/store 走连接池
    "psycopg[binary,pool]>=3.2,<4.0",
    "pymongo>=4.9.0,<5.0",         # MongoDB async driver（PyMongo 4.9+ 原生 async，替代已 EOL 的 motor）
    "redis>=5.0.0,<9.0",           # Redis async
    "neo4j>=5.25.0,<7.0",          # Neo4j (官方 async driver)

    # --- 配置与校验 ---
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "PyJWT>=2.9.0,<3.0",           # JWT 认证
    "bcrypt>=4.0.0,<6.0",          # 密码哈希（直接用，不依赖已停维的 passlib）

    # --- 可观测（OpenTelemetry）---
    # api/sdk 走稳定的 1.x；instrumentation 系列仍是 0.x beta（跟随 sdk 发布，
    # 版本号是 0.<sdk_minor>b0 的形式），所以上界放到 <1.0。
    "opentelemetry-api>=1.44.0,<2.0",
    "opentelemetry-sdk>=1.44.0,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1.0",

    # --- 工具库 ---
    "httpx>=0.27.0,<1.0",
    "python-dotenv>=1.0.0,<2.0",
    "orjson>=3.10.0,<4.0",
    "pywebview>=5.0,<7.0",         # 桌面客户端原生窗口（Windows 走 WebView2）
    "numpy>=2.0.0,<3.0",           # LangGraph InMemoryStore 语义检索的向量运算加速（运行时依赖）
    "selfagent-cli",               # 工作区成员：CLI 客户端（clients/cli，可编辑安装）
    # 注：原先声明的 tenacity 已移除——全项目零处使用。
    # LLM 的超时与重试改用 openai / anthropic SDK 内置的 timeout + max_retries
    # （见 app/llm/factory.py），它们自带针对 429/5xx 的指数退避。
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0",
    "pytest-asyncio>=0.24.0,<2.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.13.0,<3.0",
    "ipython>=8.28.0,<10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------- uv 配置 ----------
# 用标准的 PEP 735 dependency-groups；tool.uv.dev-dependencies 已被 uv 废弃。
# 内容与 optional-dependencies.dev 保持一致，避免两处漂移。
[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0",
    "pytest-asyncio>=0.24.0,<2.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.13.0,<3.0",
]

# 工作区：CLI 客户端与本后端共用同一个虚拟环境（CLI 本地模式 import app.*）
[tool.uv.workspace]
members = ["clients/cli"]

[tool.uv.sources]
selfagent-cli = { workspace = true }

# ---------- Ruff ----------
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "E501",      # 行宽由 formatter 管
    "ASYNC109",  # 自定义 async 函数带 timeout 参数：这里是转发给底层库，不是自己实现超时
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就是靠「在默认值里调用 Depends/Query/... 」实现的，
# 不是 B008 想防的「可变默认值」问题。
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# 测试里大量「函数内 import」是为了控制导入时机与隔离副作用，不强制排序
"tests/**" = ["I001", "F401"]

# ---------- pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
