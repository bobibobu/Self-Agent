# ===================================================================
# Self-Agent 基础设施 —— 一键起齐 4 个数据库
# -------------------------------------------------------------------
# 启动：  docker compose up -d
# 停止：  docker compose down
# 清空：  docker compose down -v   （删除数据卷）
# 状态：  docker compose ps
# 日志：  docker compose logs -f postgres
#
# 所有数据持久化到 ./data/ 目录，方便学习与排查。
# 详细组件说明见 infra/README.md
#
# 镜像标签钉到「小版本」（如 mongo:8.0、redis:8.2-alpine）：补丁自动跟进，
# 跨小版本/大版本由 Renovate 开 PR（见根目录 renovate.json）。
# 已有数据卷跨大版本升级的注意事项见 docs/04-guides/依赖升级记录.md。
# ===================================================================

name: self-agent

services:

  # -----------------------------------------------------------------
  # PostgreSQL —— 主库
  #   用途：LangGraph 短期记忆(checkpointer)、长期记忆(store)、
  #         用户/租户等核心业务数据。
  #   为什么用它：LangGraph 官方原生支持 Postgres checkpointer，
  #             且支持事务与向量检索(pgvector)。
  # -----------------------------------------------------------------
  postgres:
    # 用 pgvector 镜像而不是原版 postgres：LangGraph 的 PostgresStore 建
    # 语义索引时需要 vector 扩展，原版镜像里没有，store.setup() 会失败
    # （应用会降级成「持久化但无语义检索」，见 app/memory/store.py）。
    # 钉 pgvector 版本：浮动的 pg16 标签会悄悄换扩展版本。已有数据卷换镜像后
    # 执行一次 `ALTER EXTENSION vector UPDATE;` 把库里的扩展升到镜像自带版本。
    image: docker.m.daocloud.io/pgvector/pgvector:0.8.7-pg16
    container_name: selfagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: selfagent
      POSTGRES_PASSWORD: selfagent123
      POSTGRES_DB: selfagent
      # 时区
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfagent -d selfagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------
  # MongoDB —— 文档型日志库
  #   用途：对话原始事件、结构化日志、非结构化文档（Phase 3）。
  #   为什么用它：灵活 schema，适合存"形态多变"的事件流。
  # -----------------------------------------------------------------
  mongo:
    # 8.0 支持到 2029-10（7.0 到 2027-08 EOL）。已有 7.0 数据卷可直接换镜像，
    # 前提是 featureCompatibilityVersion 已是 "7.0"；稳定后再把 FCV 提到 "8.0"。
    # 不能 7.0 直跳 9.0，必须经过 8.0。
    image: docker.1panel.live/library/mongo:8.0
    container_name: selfagent-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: selfagent
      MONGO_INITDB_ROOT_PASSWORD: selfagent123
      MONGO_INITDB_DATABASE: selfagent
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------
  # Redis —— 缓存与临时态
  #   用途：LLM 响应缓存、限流计数器、会话级临时态、分布式锁。
  #   为什么用它：内存级延迟，单线程模型简单可靠。
  # -----------------------------------------------------------------
  redis:
    # 8.2 支持到 2030-09；7.x 的 RDB/AOF 文件 8.x 直接可读。
    # 想要更宽松的 BSD 许可可换 valkey/valkey:9（协议兼容，redis-py 照用）。
    image: docker.1panel.live/library/redis:8.2-alpine
    container_name: selfagent-redis
    restart: unless-stopped
    # 生产环境应通过 requirepass 设置密码，这里开发态留空
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -----------------------------------------------------------------
  # Jaeger v2 —— 链路追踪后端（OTLP 接收 + Web UI）
  #   用途：看一次对话的完整 span 树（LLM 调用、工具执行、RAG 检索的
  #         父子关系与各自耗时），排查「为什么慢 / 为什么答错」。
  #   UI： http://localhost:16686
  #   应用侧只需 OTEL_ENABLED=true（默认已指向 http://localhost:4318）。
  #   v1（jaegertracing/all-in-one）已停更，最后一版 1.76.0。v2 基于
  #   OpenTelemetry Collector，不带 --config 启动即 all-in-one 模式
  #   （内存存储、OTLP 默认开启，不再需要 COLLECTOR_OTLP_ENABLED），
  #   重启丢数据——开发够用，生产要换带持久化的部署。
  # -----------------------------------------------------------------
  jaeger:
    image: docker.m.daocloud.io/jaegertracing/jaeger:2.22.0
    container_name: selfagent-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Web UI
      - "4318:4318"     # OTLP/HTTP 接收端点（应用往这里发 span）
      - "4317:4317"     # OTLP/gRPC（备用）
    healthcheck:
      # healthcheckv2 扩展（13133/status）；镜像基于 alpine，自带 busybox wget
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------
  # Neo4j —— 图数据库
  #   用途：用户画像、实体关系知识图谱、Agent 间的协作拓扑（Phase 3+）。
  #   为什么用它：天然适合表达"实体—关系"，关系型数据库 JOIN 会很重。
  # -----------------------------------------------------------------
  neo4j:
    # 5.26 是 LTS（支持到 2028-06）；之后 Neo4j 改用日历版本号（2026.xx），
    # 那条线每月一版、只支持到下一版发布，开发环境留在 LTS 更省心。
    image: docker.1panel.live/library/neo4j:5.26-community
    container_name: selfagent-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/selfagent123
      # 关闭需要付费的功能，保持社区版纯净
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"   # 浏览器控制台 http://localhost:7474
      - "7687:7687"   # Bolt 协议（应用连接用）
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
